<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Angus 결과 모아보기</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Lexend:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: teacher console — sign-in card, then filter bar, student summary table, and a detail drawer for one student. */
:root{
  --bg:#EEF2F5;--paper:#FFFFFF;--ink:#1C2836;--muted:#5B6878;--line:#D5DDE5;
  --yarn:#1E7A6C;--yarn-soft:#DCEFEA;--mustard:#B97F0B;--mustard-soft:#FBEFD2;
  --good:#2E8B57;--bad:#C0392B;--good-soft:#E3F3E9;--bad-soft:#F9E3E0;
  --f-display:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Lexend","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#121A23;--paper:#1A2531;--ink:#E6EDF3;--muted:#9AA8B7;--line:#2C3A49;--yarn:#4CC3AE;--yarn-soft:#173A36;--mustard:#E8B24A;--mustard-soft:#3A2F17;--good:#5CC98A;--bad:#F07A6C;--good-soft:#173527;--bad-soft:#3D1F1C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,34px);margin:0}
h1 em{font-style:normal;color:var(--yarn)}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 8px}
.sub{color:var(--muted);margin:4px 0 14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:9px 14px;border:1.5px solid var(--yarn);background:var(--yarn);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--yarn)}
.btn.small{font-size:13px;padding:6px 10px;font-weight:500}
.btn:disabled{opacity:.5}
select,input{font:inherit;padding:7px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--ink);font:inherit;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yarn-soft);color:var(--yarn);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{font-family:var(--f-en);font-size:24px;font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--paper)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--yarn-soft)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}
.msg{border-radius:10px;padding:10px 12px;background:var(--mustard-soft)}
.msg.err{background:var(--bad-soft)}
.detail{margin-top:16px}
.rec{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.rec .head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--yarn-soft);color:var(--yarn)}
.tag.s{background:var(--mustard-soft);color:var(--mustard)}
.text{font-family:var(--f-en);font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.score{font-family:var(--f-en);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Be the <em>Angus</em> 결과 모아보기</h1>
  <p class="sub">선생님 전용 · 학생들이 연습실에서 채점한 결과가 학번·이름별로 모여요.</p>

  <div class="panel" id="login-box">
    <h2>선생님 로그인</h2>
    <p class="muted" style="margin:0 0 10px">Firebase 보안 규칙에 등록한 선생님 구글 계정으로 로그인해야 결과를 볼 수 있어요.</p>
    <button class="btn" id="btn-login">Google 계정으로 로그인</button>
    <p class="msg err" id="login-err" hidden></p>
  </div>

  <div id="main" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="muted" id="me"></span>
        <button class="btn ghost small" id="btn-logout">로그아웃</button>
      </div>
      <div class="row">
        <label for="f-cls">반</label><select id="f-cls"><option value="">전체</option></select>
        <div class="seg" role="group" aria-label="보기">
          <button id="v-sum" aria-pressed="true">학생별 요약</button>
          <button id="v-raw" aria-pressed="false">전체 기록</button>
        </div>
        <button class="btn ghost small" id="btn-refresh">새로고침</button>
        <button class="btn small" id="btn-csv">엑셀(CSV) 내려받기</button>
      </div>
    </div>
    <p class="msg" id="status" hidden></p>
    <div class="kpis" id="kpis"></div>
    <div class="panel tw" id="table-box"></div>
    <div class="panel detail" id="detail" hidden></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!window.firebase||!window.FIREBASE_CONFIG){$("login-err").hidden=false;$("login-err").textContent="Firebase를 불러오지 못했어요. firebase-config.js 파일이 같은 폴더에 있는지 확인해 주세요.";return;}
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore();
let rows=[],view="sum",openKey=null;

$("btn-login").onclick=async()=>{$("login-err").hidden=true;const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p);}catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){auth.signInWithRedirect(p);return;}
    $("login-err").hidden=false;$("login-err").textContent=e.code==="auth/unauthorized-domain"?"이 주소가 Firebase 승인된 도메인에 없어요. Authentication > 설정 > 승인된 도메인에 kch640000.github.io를 추가해 주세요.":"로그인하지 못했어요 ("+e.code+")";}};
$("btn-logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{$("login-box").hidden=!!u;$("main").hidden=!u;if(u){$("me").textContent=u.email+" 로그인됨";load();}});

function status(t,err){const s=$("status");s.hidden=!t;s.textContent=t||"";s.className="msg"+(err?" err":"");}
async function load(){status("불러오는 중…");
  try{const snap=await db.collection("results").orderBy("ts","desc").limit(10000).get();
    rows=snap.docs.map(d=>{const x=d.data();return Object.assign({id:d.id},x,{t:x.ts&&x.ts.toDate?x.ts.toDate():null});});
    status(rows.length?"":"아직 저장된 결과가 없어요. 학생이 연습실에서 반·번호·이름을 입력하고 채점하면 여기에 나타나요.");
    const cls=[...new Set(rows.map(r=>r.cls))].sort((a,b)=>a-b);const sel=$("f-cls"),cur=sel.value;
    sel.innerHTML='<option value="">전체</option>'+cls.map(c=>`<option value="${c}">${c}반</option>`).join("");sel.value=cur;
    render();
  }catch(e){status(e.code==="permission-denied"?"이 계정에는 결과를 볼 권한이 없어요. Firestore 규칙에 적힌 선생님 이메일과 지금 로그인한 계정이 같은지 확인해 주세요.":"불러오지 못했어요 ("+(e.code||e.message)+")",true);}}
$("btn-refresh").onclick=load;$("f-cls").onchange=()=>{openKey=null;render();};
$("v-sum").onclick=()=>{view="sum";$("v-sum").setAttribute("aria-pressed","true");$("v-raw").setAttribute("aria-pressed","false");render();};
$("v-raw").onclick=()=>{view="raw";$("v-raw").setAttribute("aria-pressed","true");$("v-sum").setAttribute("aria-pressed","false");render();};

const fmt=d=>d?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`:"—";
const typeName={w:"쓰기",s:"말하기(문항)",x:"말하기(실전)"};
function filtered(){const c=$("f-cls").value;return rows.filter(r=>!c||String(r.cls)===c);}
function summarize(list){const map=new Map();
  list.slice().sort((a,b)=>(a.t||0)-(b.t||0)).forEach(r=>{const k=r.cls+"-"+r.num;if(!map.has(k))map.set(k,{cls:r.cls,num:r.num,sid:r.sid||("2"+String(r.cls).padStart(2,"0")+String(r.num).padStart(2,"0")),name:"",w:[],s:[],x:[],last:null});const m=map.get(k);if(r.name)m.name=r.name;(m[r.type]||[]).push(r);if(r.t&&(!m.last||r.t>m.last))m.last=r.t;});
  return [...map.values()].map(m=>{const st=a=>a.length?{n:a.length,first:a[0].total,best:Math.max(...a.map(r=>r.total)),last:a[a.length-1].total}:{n:0};
    return Object.assign(m,{W:st(m.w),X:st(m.x),Sn:m.s.length,Savg:m.s.length?Math.round(m.s.reduce((a,r)=>a+r.total,0)/m.s.length*10)/10:null});}).sort((a,b)=>a.cls-b.cls||a.num-b.num);}
function diff(a,b){if(a==null||b==null)return"—";const d=b-a;return d>0?`<span class="up">+${d}</span>`:d<0?`<span class="down">${d}</span>`:"0";}
function render(){const list=filtered();const sum=summarize(list);
  const ws=sum.filter(s=>s.W.n),xs=sum.filter(s=>s.X.n);
  const avg=a=>a.length?(Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10):"—";
  $("kpis").innerHTML=`<div class="kpi"><b>${sum.length}</b><span>참여 학생</span></div>
   <div class="kpi"><b>${avg(ws.map(s=>s.W.last))}</b><span>쓰기 최근 점수 평균 / 20</span></div>
   <div class="kpi"><b>${avg(ws.map(s=>s.W.last-s.W.first))}</b><span>쓰기 평균 향상 (첫 → 최근)</span></div>
   <div class="kpi"><b>${avg(xs.map(s=>s.X.last))}</b><span>말하기 실전 최근 평균 / 20</span></div>`;
  if(view==="sum"){
    $("table-box").innerHTML=`<table><thead><tr><th>학번</th><th>이름</th><th>쓰기 횟수</th><th>쓰기 첫</th><th>최고</th><th>최근</th><th>향상</th><th>말하기 실전</th><th>실전 첫</th><th>최고</th><th>최근</th><th>향상</th><th>문항 연습</th><th>문항 평균/10</th><th>마지막 활동</th></tr></thead><tbody>
     ${sum.map(s=>`<tr data-k="${s.cls}-${s.num}"><td>${s.sid}</td><td><b>${esc(s.name)}</b></td><td>${s.W.n}</td><td>${s.W.first??"—"}</td><td>${s.W.best??"—"}</td><td><b>${s.W.last??"—"}</b></td><td>${diff(s.W.first,s.W.last)}</td><td>${s.X.n}</td><td>${s.X.first??"—"}</td><td>${s.X.best??"—"}</td><td><b>${s.X.last??"—"}</b></td><td>${diff(s.X.first,s.X.last)}</td><td>${s.Sn}</td><td>${s.Savg??"—"}</td><td class="muted">${fmt(s.last)}</td></tr>`).join("")}</tbody></table>
     <p class="muted" style="margin:8px 0 0">줄을 누르면 그 학생의 글과 말한 내용을 볼 수 있어요.</p>`;
  }else{
    $("table-box").innerHTML=`<table><thead><tr><th>시간</th><th>학번</th><th>이름</th><th>종류</th><th>질문</th><th>점수</th><th>항목별</th><th>발음</th><th>내용</th></tr></thead><tbody>
     ${list.map(r=>`<tr data-k="${r.cls}-${r.num}"><td>${fmt(r.t)}</td><td>${r.sid||""}</td><td>${esc(r.name||"")}</td><td>${typeName[r.type]||r.type}</td><td>${esc(r.q||"")}</td><td><b>${r.total}</b></td><td>${(r.crit||[]).join(" / ")}</td><td>${r.acc!=null?r.acc+"%":""}</td><td class="muted" style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${esc((r.text||"").slice(0,80))}</td></tr>`).join("")}</tbody></table>`;}
  $("table-box").querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{openKey=tr.dataset.k;renderDetail();$("detail").scrollIntoView({behavior:"smooth"});});
  renderDetail();}
function renderDetail(){const box=$("detail");if(!openKey){box.hidden=true;return;}
  const [c,n]=openKey.split("-").map(Number);const list=rows.filter(r=>r.cls===c&&r.num===n).sort((a,b)=>(b.t||0)-(a.t||0));
  box.hidden=false;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc((list.find(r=>r.sid)||{}).sid||"")} ${esc((list.find(r=>r.name)||{}).name||"")} (2학년 ${c}반 ${n}번) · 기록 ${list.length}개</h2><button class="btn ghost small" id="btn-close">닫기</button></div>
   ${list.map(r=>`<div class="rec"><div class="head"><span class="tag ${r.type==="w"?"":"s"}">${typeName[r.type]||r.type}</span>${r.q?`<span>Q${esc(r.q)}</span>`:""}<span class="score">${r.total}점</span>
     <span class="muted">${r.type==="w"?`① ${r.crit?.[0]} ② ${r.crit?.[1]} ③ ${r.crit?.[2]} ④ ${r.crit?.[3]} · ${r.wc??""}단어 · 오류 ${r.err??""}곳`:r.type==="s"?`의견 ${r.crit?.[0]} · 형식 ${r.crit?.[1]} · 발음 ${r.crit?.[2]}${r.acc!=null?` · 정확도 ${r.acc}%`:""}${r.wpm?` · ${r.wpm}단어/분`:""}${r.mode==="dict"?" · 받아쓰기":""}${r.peek?" · 대본 봄":""}`:`1차 ${r.crit?.[0]} + 2차 ${r.crit?.[1]}`}</span><span class="muted">${fmt(r.t)}</span></div>
     ${r.text?`<div class="text">${esc(r.text)}</div>`:""}</div>`).join("")}`;
  $("btn-close").onclick=()=>{openKey=null;box.hidden=true;};}

$("btn-csv").onclick=()=>{const list=filtered();let csv;
  if(view==="sum"){const sum=summarize(list);csv=[["학번","이름","반","번호","쓰기 횟수","쓰기 첫","쓰기 최고","쓰기 최근","쓰기 향상","말하기 실전 횟수","실전 첫","실전 최고","실전 최근","실전 향상","문항 연습 횟수","문항 평균(10)","마지막 활동"]].concat(sum.map(s=>[s.sid,s.name,s.cls,s.num,s.W.n,s.W.first??"",s.W.best??"",s.W.last??"",s.W.n?s.W.last-s.W.first:"",s.X.n,s.X.first??"",s.X.best??"",s.X.last??"",s.X.n?s.X.last-s.X.first:"",s.Sn,s.Savg??"",fmt(s.last)]));}
  else csv=[["시간","학번","이름","반","번호","종류","질문","점수","항목1","항목2","항목3","항목4","발음정확도","단어수","오류수","내용"]].concat(list.map(r=>[r.t?r.t.toLocaleString("ko-KR"):"",r.sid||"",r.name||"",r.cls,r.num,typeName[r.type]||r.type,r.q||"",r.total,...[0,1,2,3].map(i=>(r.crit||[])[i]??""),r.acc??"",r.wc??"",r.err??"",r.text||""]));
  const out="﻿"+csv.map(row=>row.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv;charset=utf-8"}));a.download=`angus_${view==="sum"?"학생별요약":"전체기록"}_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();};
})();
</script>
</body>
</html>
